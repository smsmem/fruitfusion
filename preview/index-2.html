<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fruit Fusion</title>
<style>
  :root {
    --glass-bg: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.28);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.35);
    --accent: #ffd447;
    --text: #f4f1ff;
    --text-dim: rgba(244,241,255,0.68);
    --safeB: max(8px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: radial-gradient(ellipse at 50% 0%, #2a1a4a 0%, #150a26 55%, #0a0512 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); user-select: none; -webkit-user-select: none;
  }
  #col { position: relative; margin: 0 auto; width: min(100vw, 480px); height: 100vh; height: 100dvh; overflow: hidden; }
  .glass {
    background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 16px;
  }
  #dev { position: absolute; top: 0; left: 0; height: 14px; line-height: 14px; padding-left: 8px; font-size: 10px; opacity: 0.7; pointer-events: none; z-index: 200; letter-spacing: 0.04em; white-space: nowrap; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---- menu screens ---- */
  .menu { flex-direction: column; align-items: center; justify-content: center; padding: 22px 16px; overflow-y: auto; }
  .card { width: 100%; max-width: 380px; padding: 22px 20px; text-align: center; }
  h1.logo { font-size: 34px; margin: 6px 0 4px; letter-spacing: 0.02em; }
  h2 { margin: 0 0 10px; font-size: 22px; }
  h3 { margin: 14px 0 6px; font-size: 15px; text-align: left; color: var(--accent); }
  .tag { color: var(--text-dim); font-size: 14px; line-height: 1.4; margin: 4px 0; }
  .fmt { font-size: 13px; color: var(--accent); margin: 8px 0 14px; font-weight: 700; }
  .logoRow { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
  .logoRow img { width: 44px; height: 44px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.45)); }
  .btn {
    display: block; width: 100%; min-height: 48px; margin: 10px 0 0; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--glass-border);
    background: var(--glass-bg); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn.primary { border: none; background: linear-gradient(135deg, #ffd447, #ff8c1a); color: #241200; box-shadow: 0 6px 22px rgba(255,170,40,0.4); font-weight: 800; }
  .btn:disabled { opacity: 0.45; }
  .foot { margin-top: 14px; font-size: 12px; color: var(--text-dim); }
  ol.steps { text-align: left; padding-left: 22px; margin: 6px 0; font-size: 14px; line-height: 1.45; }
  ol.steps li { margin: 5px 0; }
  .ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; margin: 8px 0 4px; }
  .ladder img { width: 28px; height: 28px; }
  .scroll { max-height: calc(100% - 20px); overflow-y: auto; text-align: left; }
  .scroll ol { font-size: 13px; line-height: 1.45; padding-left: 20px; margin: 4px 0; }
  .scroll li { margin: 5px 0; }
  .scroll .btn { position: sticky; bottom: 0; background: #3a2766; }
  /* ---- round screen ---- */
  #sRound { flex-direction: column; padding: 14px 8px var(--safeB); }
  #hud { height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; flex: none; }
  #sRound { gap: 0; }
  .stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 90px; }
  .statLabel { font-size: 9px; letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; }
  #scoreVal { font-size: 20px; font-weight: 800; color: #7fe7ff; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .prev { display: flex; align-items: center; gap: 8px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .slot img { width: 34px; height: 34px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
  .slot.nx img { width: 22px; height: 22px; opacity: 0.8; }
  .slot img.hide { visibility: hidden; }
  .mini { font-size: 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .hb { display: flex; gap: 6px; } .swh { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; } #hapt.off, #mute.off { opacity: 0.45; } #hapt { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; padding: 0; font-family: inherit; }
  #mute { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; font-family: inherit; }
  #strip { height: 140px; margin-top: 6px; flex: none; padding: 0 6px; overflow: hidden; position: relative; }
  #stripHead { height: 20px; line-height: 20px; font-size: 12px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rows { position: relative; height: 120px; }
  #ovfLine { display: none; position: absolute; left: 6px; right: 6px; top: 20px; height: 120px; align-items: center; justify-content: center; text-align: center; font-size: 13px; line-height: 1.35; padding: 0 10px; }
  .row { position: absolute; left: 0; right: 0; height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 13px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .row .pl { width: 22px; text-align: right; color: var(--text-dim); flex: none; }
  .row .hd { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sc { flex: none; min-width: 58px; text-align: right; }
  .row.me { background: rgba(255,255,255,0.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9); font-weight: 700; }
  #jarArea { position: relative; flex: 1; min-height: 0; margin: 6px 0; }
  #cv { position: absolute; left: 0; top: 0; touch-action: none; display: block; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, 0); pointer-events: none; font-weight: 800; font-size: 15px; color: #7fe7ff; text-shadow: 0 2px 6px rgba(0,0,0,0.6); white-space: nowrap; animation: floatUp 900ms ease-out forwards; }
  @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); } 100% { transform: translate(-50%, -50px) scale(1); opacity: 0; } }
  #tally { position: absolute; left: 50%; transform: translate(-50%, 0); pointer-events: none; font-weight: 800; font-size: 20px; color: var(--accent); text-shadow: 0 2px 8px rgba(0,0,0,0.7); white-space: nowrap; display: none; }
  #bar { height: 56px; flex: none; position: relative; touch-action: none; padding: 6px 12px 0; }
  #barLab { font-size: 12px; color: var(--text-dim); height: 18px; line-height: 18px; text-align: center; }
  #pips { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
  .pip { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.14); flex: none; }
  .pip.used { background: #7fe7ff; }
  #cdFill { position: absolute; left: 12px; right: 12px; bottom: 2px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.10); overflow: hidden; }
  #cdFill i { display: block; height: 100%; width: 0; background: rgba(255,255,255,0.55); }
  #banner { position: absolute; left: 8px; right: 8px; top: 4px; height: 20px; line-height: 20px; font-size: 12px; font-weight: 700; text-align: center; background: #2a1a4a; border-radius: 8px; display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 374px), (max-height: 780px) {
    #hud { height: 44px; } #strip { margin-top: 4px; } #jarArea { margin: 4px 0; } #bar { height: 52px; }
    .row { font-size: 12px; } .pip { width: 11px; height: 11px; }
  }
  /* ---- result ---- */
  #sResult { flex-direction: column; align-items: center; justify-content: center; padding: 22px 8px 16px; overflow-y: auto; }
  #resCard { width: 100%; max-width: 440px; padding: 14px 10px 12px; }
  #resCard h2 { text-align: center; font-size: 18px; margin: 0 0 6px; }
  #final { margin: 0; }
  .frow { display: flex; align-items: center; gap: 6px; padding: 2px 6px; min-height: 25px; font-size: 13px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .frow .pl { width: 22px; text-align: right; color: var(--text-dim); flex: none; }
  .frow .hd { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .sc { flex: none; min-width: 52px; text-align: right; }
  .frow .rw { flex: none; width: 126px; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; line-height: 1.15; }
  .frow .rw img { width: 18px; height: 18px; flex: none; }
  .frow.me { background: rgba(255,255,255,0.16); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.9); font-weight: 700; }
  .divider { height: 0; border-top: 1px dashed rgba(255,255,255,0.35); margin: 3px 6px; }
  #resSum { text-align: center; margin-top: 8px; line-height: 1.5; }
  #resSum .l1 { font-size: 15px; font-weight: 700; }
  #resSum .l2 { font-size: 18px; font-weight: 800; color: var(--accent); }
  #resSum .l3 { font-size: 13px; color: var(--text); }
  #resSum .l4 { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  #sResult .btns { display: flex; gap: 8px; margin-top: 8px; }
  #sResult .btns .btn { margin: 0; }
  #sResult.fade #resCard { animation: fadeIn 250ms ease-out 1; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* ---- fix pass 1 (2026-11-07) ---- */
  :root { --rz: #EE237E; --rzGold: #D4AF87; --t-short: #8d93ad; --t-even: #7fe7ff; --t-win: #5fe08a; --t-big: #ffae2b; --t-mega: #ff4fd8; }
  #dev { display: none; } body.devhost #dev { display: block; }
  .rzLock { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.22em; color: var(--rz); margin: 0 0 6px; }
  .rzLock svg { width: 14px; height: 14px; }
  .card.glass, #resCard { border-top: 3px solid var(--rz); }
  .stakeRow { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; }
  .stakeLab { font-size: 10px; letter-spacing: 0.12em; color: var(--rzGold); text-transform: uppercase; margin-top: 2px; }
  .coin { min-width: 56px; height: 34px; border-radius: 17px; border: 2px solid rgba(212,175,135,0.55); background: radial-gradient(circle at 35% 30%, #fff3c4, #e9b949 55%, #a97a16); color: #2a1800; font-weight: 900; font-size: 14px; font-family: inherit; cursor: pointer; padding: 0 8px; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); opacity: 0.55; }
  .coin.on { opacity: 1; border-color: #fff; box-shadow: 0 0 0 2px var(--rz), inset 0 -2px 0 rgba(0,0,0,0.25); }
  .sess { margin-top: 10px; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .npn { display: block; margin-top: 4px; font-size: 10.5px; color: var(--text-dim); }
  .stat { flex: 1; min-width: 0; }
  .stakeHud { display: flex; align-items: center; gap: 5px; }
  .chipC { font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 8px; background: linear-gradient(135deg, #f2cf6d, #c9932a); color: #2a1800; letter-spacing: 0.04em; white-space: nowrap; }
  #hudNow { font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 2px; }
  #hudNow .m { color: var(--accent); }
  #scoreVal { display: none; }
  .row .ic { width: 15px; height: 15px; flex: none; }
  .row .ic img { width: 15px; height: 15px; display: block; }
  .row.gap { border-top: 1px dashed rgba(255,255,255,0.28); border-top-left-radius: 0; border-top-right-radius: 0; }
  .row.up { animation: rowUp 650ms ease-out 1; } .row.down { animation: rowDown 650ms ease-out 1; }
  @keyframes rowUp { 0% { background: rgba(255,212,71,0.75); } 100% { background: rgba(255,255,255,0.16); } }
  @keyframes rowDown { 0% { background: rgba(255,59,92,0.55); } 100% { background: rgba(255,255,255,0.16); } }
  #bar { height: 70px; } @media (max-width: 374px), (max-height: 780px) { #bar { height: 66px; } }
  #evo { display: flex; justify-content: center; gap: 3px; position: absolute; left: 0; right: 0; bottom: 8px; }
  #evo img { width: 13px; height: 13px; opacity: 0.2; filter: grayscale(1); transition: opacity 300ms, filter 300ms; }
  #evo img.lit { opacity: 1; filter: none; }
  #resCard { border: 2px solid var(--tc, var(--glass-border)); border-top: 3px solid var(--rz); }
  #resCard.t-short { --tc: var(--t-short); } #resCard.t-even { --tc: var(--t-even); } #resCard.t-win { --tc: var(--t-win); } #resCard.t-big { --tc: var(--t-big); box-shadow: 0 0 26px rgba(255,174,43,0.45); }
  #resCard.t-mega { --tc: var(--t-mega); box-shadow: 0 0 34px rgba(255,79,216,0.6); }
  .tierBadge { display: inline-block; margin: 4px 0 2px; padding: 2px 12px; border-radius: 10px; font-size: 13px; font-weight: 900; letter-spacing: 0.16em; color: #12081f; background: var(--tc); }
  #resSum .net { font-size: 15px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #resSum .net b.pos { color: #5fe08a; } #resSum .net b.neg { color: #ff6b81; } #resSum .net b.zero { color: var(--text); }
  #resSum .why { font-size: 13px; color: #ffd0d8; }
  #rChange { margin-top: 8px; }
  #rStake { display: none; margin-top: 8px; } #rStake.on { display: flex; }
  .tlink { display: block; margin: 10px auto 0; background: none; border: none; color: var(--text-dim); text-decoration: underline; font-size: 13px; font-family: inherit; cursor: pointer; }
  #mega { position: absolute; inset: 0; z-index: 150; display: none; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 45%, rgba(255,79,216,0.55), rgba(20,6,40,0.96) 70%); text-align: center; overflow: hidden; }
  #mega.on { display: flex; }
  #mega img.big { width: 46vw; max-width: 220px; animation: megaPop 900ms cubic-bezier(.2,1.6,.4,1) 1; filter: drop-shadow(0 0 30px rgba(255,255,255,0.6)); }
  #mega .t1 { font-size: 34px; font-weight: 900; letter-spacing: 0.08em; color: #fff; text-shadow: 0 0 18px var(--t-mega); margin-top: 10px; }
  #mega .t2 { font-size: 26px; font-weight: 900; color: var(--accent); margin-top: 6px; font-variant-numeric: tabular-nums; }
  #mega .rain { position: absolute; top: -40px; width: 30px; height: 30px; animation: rain 1.8s linear infinite; }
  @keyframes megaPop { 0% { transform: scale(0.2) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes rain { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<div id="col">
  <div id="mega"></div>
  <div id="dev">DEV BUILD</div>

  <div class="screen menu on" id="sTitle">
    <div class="card glass">
      <div class="rzLock" id="tLock"></div><div class="logoRow" id="logoRow"></div>
      <h1 class="logo" id="tTitle"></h1>
      <p class="tag" id="tTag"></p>
      <p class="fmt" id="tFmt"></p>
      <div class="stakeLab" id="tStakeLab"></div><div class="stakeRow" id="tStake"></div>
      <button class="btn primary" id="bPlay"></button>
      <button class="btn" id="bHow"></button>
      <button class="btn" id="bRules"></button>
      <p class="foot" id="tFoot"></p>
      <div class="sess" id="tSess"></div>
    </div>
  </div>

  <div class="screen menu" id="sHow">
    <div class="card glass">
      <h2 id="hTitle"></h2>
      <ol class="steps" id="hSteps"></ol>
      <div class="ladder" id="hLadder"></div>
      <button class="btn primary" id="hPlay"></button>
      <button class="btn" id="hBack"></button>
    </div>
  </div>

  <div class="screen" id="sRound">
    <div id="hud" class="glass">
      <div class="stat"><div class="stakeHud"><span class="statLabel" id="lScore"></span><span class="chipC" id="hudStake"></span></div><div id="hudNow"></div><div id="scoreVal">0</div></div>
      <div class="prev">
        <div class="slot"><img id="imgNow" class="hide" alt=""><div class="mini" id="lNow"></div></div>
        <div class="slot nx"><img id="imgNext" class="hide" alt=""><div class="mini" id="lNext"></div></div>
      </div>
      <div class="hb"><button id="hapt"></button><button id="mute"></button></div><input type="checkbox" switch id="iosSw" class="swh" tabindex="-1" aria-hidden="true"><label for="iosSw" id="iosLbl" class="swh"></label>
    </div>
    <div id="strip" class="glass"><div id="stripHead"></div><div id="rows"></div><div id="ovfLine"></div></div>
    <div id="jarArea"><canvas id="cv"></canvas><div id="fx"></div><div id="tally"></div></div>
    <div id="bar" class="glass">
      <div id="barLab"></div><div id="pips"></div><div id="evo"></div><div id="cdFill"><i></i></div><div id="banner"></div>
    </div>
  </div>

  <div class="screen" id="sResult">
    <div id="resCard" class="glass">
      <div class="rzLock" id="rLock"></div>
      <h2 id="rHead"></h2>
      <div id="final"></div>
      <div id="resSum"></div>
      <button class="btn primary" id="rAgain"></button><button class="btn" id="rChange"></button><div class="stakeRow" id="rStake"></div>
      <button class="tlink" id="rRules"></button>
      <div class="sess" id="rSess"></div>
    </div>
  </div>

  <div class="screen menu" id="sRules">
    <div class="card glass scroll" id="rulesCard">
      <h2 id="ruTitle"></h2>
      <h3 id="ruRulesH"></h3><ol id="ruRules"></ol>
      <h3 id="ruTermsH"></h3><ol id="ruTerms"></ol>
      <button class="btn" id="ruBack"></button>
    </div>
  </div>

  }
  function onPlay() { if (!ready || initFail) return; play('stake'); haptic(15); if (!seenHow) { seenHow = true; howFrom = 'play'; showHow(); } else startRound(); }
  let howFrom = 'title';
  function showHow() { $('hBack').style.display = howFrom === 'title' ? '' : 'none'; showScreen('how'); }
  $('bPlay').addEventListener('click', onPlay);
  $('bHow').addEventListener('click', () => { howFrom = 'title'; showHow(); });
  $('hPlay').addEventListener('click', () => { seenHow = true; play('stake'); haptic(15); startRound(); });
  $('hBack').addEventListener('click', () => showScreen('title'));
  $('bRules').addEventListener('click', () => { rulesFrom = 'title'; showScreen('rules'); });
  $('rRules').addEventListener('click', () => { rulesFrom = 'result'; showScreen('rules'); });
  $('ruBack').addEventListener('click', () => showScreen(rulesFrom));
  $('rAgain').addEventListener('click', () => { play('stake'); startRound(); });
  $('rChange').addEventListener('click', () => { const on = !$('rStake').classList.contains('on'); $('rStake').classList.toggle('on', on); $('rChange').textContent = on ? COPY.btnChangeDone : COPY.btnChange; haptic(8); });
  $('mute').addEventListener('click', () => { muted = !muted; updateMute(); });
  $('hapt').addEventListener('click', () => { hapticsOn = !hapticsOn; updateHapt(); if (hapticsOn) haptic(14); }); updateHapt();

  // ------------------------------------------------------------ input: slide to aim, release to drop
  let aiming = false;
  function worldX(clientX) { const r = cv.getBoundingClientRect(); return (clientX - r.left - OX) / SC; }
  function setAim(ev) { if (R) R.aimX = worldX(ev.clientX); }
  function tryDrop() {
    if (!R || !R.last || R.ended || !R.last.can) return;
    const tier = R.last.cur, r = RAD[tier]; const x = Math.min(Math.max(R.aimX, r + 1), 600 - r - 1);
    dropsPosted++; w1.postMessage({ k: 'drop', x });
  }
  for (const id of ['jarArea', 'bar']) {
    const e = $(id);
    e.addEventListener('pointerdown', ev => { if (screen !== 'round') return; ensureAudio(); aiming = true; setAim(ev); try { e.setPointerCapture(ev.pointerId); } catch (x) { /* ignore */ } });
    e.addEventListener('pointermove', ev => { if (screen !== 'round') return; if (aiming || ev.pointerType === 'mouse') setAim(ev); });
    e.addEventListener('pointerup', ev => { if (!aiming) return; aiming = false; setAim(ev); tryDrop(); });
    e.addEventListener('pointercancel', () => { aiming = false; });
  }
  window.addEventListener('keydown', ev => {
    if (screen !== 'round' || !R) return;
    if (ev.key === 'ArrowLeft') R.aimX -= 10; else if (ev.key === 'ArrowRight') R.aimX += 10; else if (ev.key === ' ') { ev.preventDefault(); tryDrop(); }
  });
  window.addEventListener('resize', () => { if (screen === 'round') layoutCanvas(); });

  // ------------------------------------------------------------ test API (?test=1 only)
  const rectOf = e => { const r = e.getBoundingClientRect(); return { l: r.left, t: r.top, r: r.right, b: r.bottom, w: r.width, h: r.height }; };
  function hashCanvas() {
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data, u = new Uint32Array(d.buffer, d.byteOffset, d.byteLength >> 2); let h = 2166136261 >>> 0;
    for (let i = 0; i < u.length; i++) { h ^= u[i]; h = Math.imul(h, 16777619) >>> 0; }
    return h.toString(16);
  }
  if (TEST) {
    window.__ff = {
      ready: () => readyP,
      goto: name => { if (name === 'round' && !R) { R = newRound(); } showScreen(name); },
      start: o => { o = o || {}; startRound(o); },
      resume: pauseAt => w1.postMessage({ k: 'resume', pauseAt }),
      messages: () => msgLog.map(x => ({ i: x.i, at: x.at, m: JSON.stringify(x.m) })),
      msgObjects: () => msgLog,
      clearMessages: () => { msgLog.length = 0; msgIdx = 0; },
      setLogging: on => { logOn = !!on; },
      pausedCount: () => pausedN,
      layout: () => {
        const a = cv.getBoundingClientRect();
        const jr = { l: a.left + OX - 14 * SC, t: a.top + OY - 40 * SC, r: a.left + OX + 614 * SC, b: a.top + OY + 914 * SC };
        const dz = { l: a.left + OX, t: a.top + OY - 10 * SC, r: a.left + OX + 600 * SC, b: a.top + OY + 110 * SC };
        const pv = $('hud').querySelector('.prev'); const bn = $('banner');
        return { vw: innerWidth, vh: innerHeight, scale: SC, jar: jr, dropZone: dz, preview: rectOf(pv), score: rectOf($('hud').querySelector('.stat')), mute: rectOf($('mute')), hud: rectOf($('hud')), strip: rectOf($('strip')), stripHead: rectOf($('stripHead')), bar: rectOf($('bar')), banner: rectOf(bn), bannerOn: bn.style.display !== 'none', dev: rectOf($('dev')), toast: rectOf(bn), popupClamp: { t: a.top + OY + 130 * SC }, tally: rectOf($('tally')), rows: [...$('rows').children].map(rectOf) };
      },
      boardFixture: (rows, header, bn) => {
        if (!R) R = newRound(); showScreen('round'); clearStrip();
        renderRows(rows); $('stripHead').textContent = header; $('scoreVal').textContent = fmt(rows.find(r => r.you) ? rows.find(r => r.you).score : 0);
        if (bn) { banners.overflow = !!bn.overflow; banners.autoplay = !!bn.autoplay; banners.toast = !!bn.toast; refreshBanner(); }
      },
      fps: () => { const a = fpsLog.slice().sort((x, y) => x - y); const med = a.length ? a[Math.floor(a.length / 2)] : 0; return { n: a.length, medianMs: med, fps: med ? 1000 / med : 0, p95Ms: a.length ? a[Math.floor(a.length * 0.95)] : 0, over50: a.filter(x => x > 50).length, p5fps: a.length ? 1000 / a[Math.floor(a.length * 0.95)] : 0 }; },
      resetFps: () => { fpsLog.length = 0; },
      stats: () => new Promise(res => { statsWaiters.push(res); w1.postMessage({ k: 'stats' }); }),
      roundLog: () => new Promise(res => { logWaiters.push(res); w1.postMessage({ k: 'getLog' }); }),
      state: () => ({ screen, ready, initFail, dropsPosted, hasRound: !!R, ended: R ? R.ended : null, fin: R ? R.fin : null, engine: window.__ffEngine || null, alertsShown: alertsShown.slice(), latest: R ? R.latest : null }),
      soundLog: () => soundLog.slice(), clearSoundLog: () => { soundLog.length = 0; },
      ovf: () => ({ on: $('ovfLine').style.display !== 'none', line: $('ovfLine').textContent, rows: $('rows').children.length, head: $('stripHead').textContent, hud: $('scoreVal').textContent, tallyOn: $('tally').style.display !== 'none' && $('tally').textContent !== '', ovfEnd: R ? R.ovfEnd : null, rect: rectOf($('ovfLine')), strip: rectOf($('strip')) }),
      domText: () => ({ strip: $('stripHead').textContent + '||' + [...$('rows').children].map(e => e.textContent).join('|'), hud: $('scoreVal').textContent, you: ($('rows').querySelector('.me .sc') || {}).textContent || null, head: $('stripHead').textContent }),
      renderFrame: t => { forceFrame = t; draw(); const h = hashCanvas(); forceFrame = null; return h; },
      hashNow: () => hashCanvas(),
      alertsShown: () => alertsShown.slice(),
      dropsPosted: () => dropsPosted,
      setAim: x => { if (R) R.aimX = x; },
      rects: () => ({ cv: rectOf(cv), SC, OX, OY }),
      showToast, setBanner,
      snap: () => ({ stake: STAKE, hud: $('hudNow').textContent, head: $('stripHead').textContent, card: $('resCard').className, sum: $('resSum').innerText, again: $('rAgain').textContent, sess: $('tSess').textContent })
    };
  }

  // ------------------------------------------------------------ boot
  buildStatic();
  spritesReady.then(buildSprites);
  readyP.then(ok => { if (ok) buildRules(); setDev(); });
  window.addEventListener('load', () => { boot(); requestAnimationFrame(raf); });
  window.addEventListener('resize', () => {});
})();

</script>
